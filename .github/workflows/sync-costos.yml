name: Sync costos del proveedor

on:
  schedule:
    - cron: "0 10 * * *" # 07:00 Argentina
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright tsx && npx playwright install --with-deps chromium
      - run: npx tsx scripts/sync-costos.ts --apply
        env:
          SUPPLIER_EMAIL: ${{ secrets.SUPPLIER_EMAIL }}
          SUPPLIER_PASSWORD: ${{ secrets.SUPPLIER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-costos-error
          path: sync-costos-error.png
          if-no-files-found: ignore
